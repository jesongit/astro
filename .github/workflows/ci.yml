name: CI

permissions:
  contents: read

on:
  pull_request:
    types:
      - opened
      - edited
      - synchronize
      - reopened
  workflow_call:

jobs:
  quality:
    name: Code standards, tests & build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    strategy:
      matrix:
        node-version: [22]

    steps:
      - name: "☁️ Checkout repository"
        uses: actions/checkout@v4

      - name: "📦 Install pnpm"
        uses: pnpm/action-setup@v4
        with:
          version: 10.11.1

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "pnpm"

      - name: "📦 Install dependencies (frozen lockfile)"
        run: pnpm install --frozen-lockfile

      - name: "🔎 Lint code"
        run: pnpm run lint

      - name: "🧭 Typecheck site and Worker"
        run: pnpm run typecheck

      - name: "📝 Checking code format"
        run: pnpm run format:check

      - name: "🧪 Protocol & logic tests"
        run: pnpm run test

      - name: "🧪 Worker integration tests"
        run: pnpm run test:worker

      - name: "🚀 Build the project (check + build + pagefind + copy)"
        run: pnpm run build

      - name: "🛡️ Artifact checks (routes / drafts / secrets)"
        run: pnpm run check:artifact && pnpm run check:routes

      - name: "🎭 Install Playwright browser"
        run: pnpm exec playwright install --with-deps chromium

      - name: "🌐 Isolated browser acceptance"
        run: pnpm run test:e2e
